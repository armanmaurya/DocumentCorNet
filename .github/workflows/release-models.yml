name: Release Model Version

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v1.0.0 or v2)'
        required: false
        type: string
        default: ''
      release_title:
        description: 'Release title'
        required: false
        type: string
        default: ''
      draft:
        description: 'Publish release as a draft'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Mark release as pre-release'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Package and Release Model Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Determine Version Tag and Title
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            SHORT_SHA="$(git rev-parse --short HEAD)"
            TAG="v0.0.0-${SHORT_SHA}"
          fi

          if [ -n "${{ github.event.inputs.release_title }}" ]; then
            TITLE="${{ github.event.inputs.release_title }}"
          else
            TITLE="DocCornerNet Model Release ${TAG}"
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=${TITLE}" >> "$GITHUB_OUTPUT"

      - name: Stage Release Assets & Checksums
        shell: bash
        run: |
          mkdir -p release_assets

          # Copy model files directly (no zip archives)
          if [ -d "models" ] && [ -n "$(ls -A models 2>/dev/null)" ]; then
            cp -r models/* release_assets/
          fi

          # Generate SHA-256 checksums manifest
          cd release_assets
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
